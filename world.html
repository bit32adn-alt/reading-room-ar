<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
    font: 15px/1.35 -apple-system, system-ui, "Segoe UI", sans-serif; color: #fff; }
  canvas#camerafeed { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; left: 0; right: 0; pointer-events: none; display: flex; justify-content: center;
    padding: 0 max(16px, env(safe-area-inset-left)); }
  #hint { top: calc(env(safe-area-inset-top) + 18px); }
  #hint span { background: rgba(0,0,0,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 9px 14px; border-radius: 999px; font-size: 14px; transition: opacity .4s; }
  #bar { bottom: calc(env(safe-area-inset-bottom) + 20px); gap: 10px; align-items: center; }
  #bar > * { pointer-events: auto; }
  .pill { background: rgba(255,255,255,.92); color: #1d1b18; border-radius: 999px; padding: 10px 18px;
    font-weight: 600; letter-spacing: .01em; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
  button.round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55);
    color: #fff; font-size: 20px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  button.round:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #111; z-index: 5; transition: opacity .5s; }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="camerafeed"></canvas>
<div id="loading"><div>Loading the room…</div></div>
<div class="ui" id="hint"><span id="hinttext">Point at the floor or a table, then tap to place the room</span></div>
<div class="ui" id="bar">
  <button class="round" id="reset" aria-label="Reset size and rotation">↺</button>
  <div class="pill" id="label">Reading Room</div>
  <button class="round" id="recenter" aria-label="Recenter tracking">⌖</button>
</div>
<script type="module" src="./world.js"></script>
</body>
</html>
